name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build -o viscall .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Smoke test
        run: ./viscall sample.js
